<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tau Volantis — Mapa de Campo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Oswald:wght@400;500;600;700&display=swap');

  :root{
    --ice-050:#eef4f8;
    --ice-100:#cfe0ea;
    --ice-300:#7fa6bf;
    --ice-500:#3d6c8a;
    --frost:#8fd7e8;
    --hazard:#d3572a;
    --safe:#7fb98a;
    --bg-0:#0b1014;
    --bg-1:#101820;
    --bg-2:#161f28;
    --line:#26333d;
    --ink:#dbe8ee;
    --ink-dim:#7d909b;
    --hud-bg:rgba(11,16,20,0.5);
    --hud-bg-active:rgba(13,19,24,0.86);
    --hud-line:rgba(38,51,61,0.65);

    --water:#4fb3d9;
    --supply:#c9a15a;
    --fuel:#d98c2b;
    --medic:#e0524a;
    --ammo:#9aa0a6;
    --rad:#c9d94a;
    --threat:#8a5fba;
    --extract:#e0c23c;
    --comm:#4fb090;
    --trap:#a05a3a;
    --vehicle:#5a7a94;
    --neutral:#c7d2d8;

    /* -------- design tokens (forma / profundidade / movimento) -------- */
    --r-xs:6px;
    --r-sm:9px;
    --r-md:14px;
    --r-lg:18px;
    --r-pill:999px;
    --shadow-1:0 2px 8px rgba(0,0,0,0.28);
    --shadow-2:0 10px 28px rgba(0,0,0,0.38), 0 2px 8px rgba(0,0,0,0.3);
    --shadow-glow:0 0 0 1px rgba(143,215,232,0.12), 0 10px 28px rgba(0,0,0,0.4);
    --ease-soft:cubic-bezier(.25,.8,.4,1);
    --tap-min:44px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(143,215,232,0.06), transparent 45%),
      radial-gradient(ellipse at 100% 0%, rgba(211,87,42,0.05), transparent 40%),
      var(--bg-0);
    color:var(--ink);
    font-family:'Space Mono', monospace;
  }

  h1,h2,h3,.display{font-family:'Oswald',sans-serif; letter-spacing:0.02em;}

  /* ---------- fullscreen map stage ---------- */
  main{ position:fixed; inset:0; }
  #map-wrap{ position:absolute; inset:0; }
  #map{ height:100%; width:100%; background:var(--bg-1); }
  #map.dark-streets .leaflet-tile-pane{
    filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9) saturate(0.6);
  }

  .map-loading{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-1); color:var(--ink-dim);
    font-size:0.78rem; text-transform:uppercase; letter-spacing:0.16em;
    z-index:2000;
    transition:opacity 0.2s ease;
  }

  .draw-hint{
    position:absolute; top:4.8rem; left:50%; transform:translateX(-50%);
    background:var(--bg-2); border:1px solid var(--hazard); color:var(--ink);
    font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em;
    padding:0.5rem 0.9rem; z-index:1200; display:flex; align-items:center; gap:0.5rem;
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
    max-width:90vw; text-align:center;
  }
  .draw-hint .dot{ width:7px;height:7px;border-radius:50%; background:var(--hazard); animation:pulse 1.4s infinite ease-in-out; display:inline-block; flex-shrink:0; }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}

  /* ---------- HUD panels (semi-transparent overlays) ---------- */
  .hud-panel{
    position:absolute;
    background:var(--hud-bg);
    backdrop-filter:blur(10px) saturate(1.1);
    -webkit-backdrop-filter:blur(10px) saturate(1.1);
    border:1px solid var(--hud-line);
    border-radius:var(--r-lg);
    box-shadow:var(--shadow-1);
    opacity:0.68;
    transition:opacity 0.2s var(--ease-soft), background 0.2s var(--ease-soft), border-color 0.2s var(--ease-soft), box-shadow 0.2s var(--ease-soft);
    z-index:900;
  }
  .hud-panel:hover, .hud-panel:focus-within{
    opacity:1;
    background:var(--hud-bg-active);
    border-color:var(--ice-300);
    box-shadow:var(--shadow-2);
  }

  /* Em telas largas o cluster não existe visualmente (display:contents):
     cada painel mantém a posição absoluta original, ancorada nos 4 cantos.
     Em telas estreitas (media query abaixo) o cluster vira uma coluna real,
     empilhando os painéis do topo em vez de deixá-los flutuar livres — isso
     é o que garante que eles nunca se sobreponham, não importa o quanto o
     conteúdo de cada um cresça (nomes longos, mais stats, etc). */
  .hud-top-cluster{ display:contents; }

  .hud-identity{
    top:1rem; left:1rem;
    padding:0.7rem 1rem 0.75rem;
    max-width:250px;
  }
  .hud-identity .eyebrow{
    font-size:0.62rem; color:var(--hazard); text-transform:uppercase; letter-spacing:0.24em;
    display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem;
  }
  .hud-identity .eyebrow::before{ content:""; width:6px; height:6px; background:var(--hazard); display:inline-block; animation:pulse 2.2s infinite ease-in-out; flex-shrink:0; }
  .sync-status{
    margin-top:0.4rem; font-size:0.58rem; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--ink-dim); display:flex; align-items:center; gap:0.4rem;
  }
  .sync-status::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--ink-dim); flex-shrink:0; }
  .sync-status.live{ color:var(--safe, #7fb98a); }
  .sync-status.live::before{ background:var(--safe, #7fb98a); }
  .sync-status.offline{ color:var(--hazard); }
  .sync-status.offline::before{ background:var(--hazard); }
  .hud-identity h1{
    font-size:1.1rem; font-weight:600; margin:0 0 0.5rem; color:var(--ink); text-transform:uppercase; line-height:1.15;
  }
  .hud-identity h1 span{ color:var(--frost); }
  .hud-stats{ display:flex; gap:0.85rem; flex-wrap:wrap; }
  .hud-stats div{ font-size:0.58rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.1em; }
  .hud-stats b{ display:block; font-family:'Oswald',sans-serif; font-size:0.95rem; color:var(--frost); letter-spacing:0; }

  /* ---------- conta / login com Google ---------- */
  .hud-account{ margin-top:0.55rem; padding-top:0.5rem; border-top:1px solid var(--hud-line); }
  #google-login-btn{ width:100%; justify-content:center; }
  .hud-account-user{ display:none; align-items:center; gap:0.5rem; }
  .hud-account-avatar{
    flex-shrink:0; width:26px; height:26px; border-radius:50%;
    background-color:var(--bg-1); background-size:cover; background-position:center;
    border:1px solid var(--ice-300);
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-size:0.72rem; font-weight:600; color:var(--frost);
  }
  .hud-account-info{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .hud-account-name{
    font-family:'Oswald',sans-serif; font-size:0.78rem; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .hud-account-edit, .hud-account-logout{
    background:none; border:none; padding:0; color:var(--ink-dim);
    font-family:'Space Mono',monospace; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.06em;
    cursor:pointer; text-align:left;
  }
  .hud-account-edit:hover{ color:var(--frost); }
  .hud-account-logout{ flex-shrink:0; }
  .hud-account-logout:hover{ color:var(--hazard); }

  /* ---------- modal de nome de jogador (mesmo padrão do view-settings-popover) ---------- */
  #player-name-modal input[type=text]{
    width:100%; background:var(--bg-1); border:1px solid var(--line); border-radius:var(--r-xs); color:var(--ink);
    font-family:'Space Mono',monospace; font-size:0.78rem; padding:0.55rem 0.6rem; box-sizing:border-box;
    outline:none; transition:border-color 0.15s var(--ease-soft);
  }
  #player-name-modal input[type=text]:focus{ border-color:var(--frost); }
  #player-name-modal p{ font-size:0.68rem; color:var(--ink-dim); line-height:1.4; margin:0 0 0.6rem; }
  .popup-owner{ font-size:0.62rem; color:var(--ink-dim); margin:-0.15rem 0 0.5rem; }

  .hud-layer{
    top:1rem; right:1rem;
    padding:0.6rem;
    display:flex; flex-direction:column; gap:0.4rem;
    position:absolute;
  }

  .hud-search{
    top:1rem; left:50%; transform:translateX(-50%);
    padding:0.55rem 0.65rem;
    width:min(320px, 62vw);
  }
  .hud-search input{
    width:100%; min-height:2.3rem; background:rgba(16,24,32,0.75); border:1px solid var(--line); border-radius:var(--r-sm); color:var(--ink);
    font-family:'Space Mono',monospace; font-size:0.72rem; padding:0.45rem 0.6rem; outline:none;
    transition:border-color 0.15s var(--ease-soft);
  }
  .hud-search input:focus{ border-color:var(--frost); }
  .hud-search input::placeholder{ color:var(--ink-dim); }
  .search-results{
    display:none; margin-top:0.4rem; max-height:260px; overflow-y:auto;
    border-top:1px solid var(--line);
  }
  .search-result{
    padding:0.5rem 0.4rem; cursor:pointer; border-bottom:1px solid rgba(38,51,61,0.5);
    border-radius:var(--r-xs);
    display:flex; flex-direction:column; gap:0.15rem;
    transition:background 0.15s var(--ease-soft);
  }
  .search-result:last-child{ border-bottom:none; }
  .search-result:hover{ background:rgba(143,215,232,0.1); }
  .search-result-kicker{ font-size:0.55rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--hazard); }
  .search-result-label{ font-size:0.68rem; color:var(--ink); line-height:1.3; }
  .search-empty{ font-size:0.65rem; color:var(--ink-dim); padding:0.4rem 0.15rem; }

  .hud-toolbar{
    left:50%; bottom:1rem; transform:translateX(-50%);
    padding:0.7rem 0.9rem;
    display:flex; flex-wrap:wrap; gap:0.6rem 1.1rem; align-items:center;
    max-width:94vw;
  }
  .toolbar-group{ display:flex; flex-wrap:wrap; gap:0.4rem; align-items:center; }
  .toolbar-label{
    font-size:0.6rem;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--ink-dim);
    margin-right:0.15rem;
  }
  .tool-btn{
    background:rgba(22,31,40,0.6);
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    color:var(--ink-dim);
    font-family:'Space Mono',monospace;
    font-size:0.68rem;
    min-height:2.15rem;
    padding:0.42rem 0.7rem;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:0.04em;
    display:flex;
    align-items:center;
    gap:0.4rem;
    transition:border-color 0.15s var(--ease-soft), color 0.15s var(--ease-soft), background 0.15s var(--ease-soft), transform 0.15s var(--ease-soft);
  }
  .tool-btn:hover{ border-color:var(--ice-300); color:var(--ink); transform:translateY(-1px); }
  .tool-btn:active{ transform:translateY(0); }
  .tool-btn.active{ border-color:var(--frost); color:var(--frost); background:rgba(143,215,232,0.1); }
  .tool-btn .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }
  .toolbar-divider{ width:1px; align-self:stretch; background:var(--line); border-radius:var(--r-pill); }
  .reset-link{
    background:none;
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    color:var(--ink-dim);
    font-family:'Space Mono',monospace;
    font-size:0.62rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    cursor:pointer;
    min-height:2.15rem;
    padding:0.4rem 0.6rem;
    transition:border-color 0.15s var(--ease-soft), color 0.15s var(--ease-soft);
  }
  .reset-link:hover{ color:var(--hazard); border-color:var(--hazard); }

  .hud-credits{
    position:absolute; bottom:0.6rem; left:0.9rem;
    font-size:0.6rem; color:var(--ink-dim); opacity:0.55;
    letter-spacing:0.02em; z-index:800; pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,0.8);
    max-width:70vw;
  }
  .hud-credits a{ color:var(--ink-dim); pointer-events:auto; }

  @media (max-width:720px){
    /* O cluster do topo vira uma coluna real: identidade, busca e camadas
       empilham em ordem, cada uma ocupando a largura toda. Como a altura de
       cada painel some ao fluxo (não é mais posição absoluta independente),
       é fisicamente impossível um cobrir o outro, mesmo com texto maior,
       nome de jogador longo, teclado aberto etc. */
    .hud-top-cluster{
      display:flex;
      flex-direction:column;
      align-items:stretch;
      gap:0.5rem;
      position:absolute;
      top:0.65rem; left:0.65rem; right:0.65rem;
      z-index:900;
      pointer-events:none;
    }
    .hud-top-cluster .hud-panel{
      position:static;
      width:100%;
      max-width:none;
      pointer-events:auto;
    }
    .hud-identity{ padding:0.6rem 0.8rem 0.65rem; }
    .hud-identity h1{ font-size:0.92rem; }
    .hud-stats{ gap:0.6rem; }
    .hud-search{ transform:none; }
    .hud-search input{ font-size:0.78rem; }
    .hud-layer{
      flex-direction:row; flex-wrap:wrap; align-items:center;
      padding:0.5rem;
    }
    .draw-hint{
      position:static; top:auto; left:auto; transform:none;
      align-self:center; width:fit-content; max-width:92vw;
      pointer-events:auto;
    }
    .leaflet-control-zoom{ display:none !important; } /* toque/pinça já cobre o zoom; libera espaço de tela */
    .hud-toolbar{ bottom:0.6rem; padding:0.55rem 0.6rem; gap:0.45rem 0.7rem; max-width:96vw; overflow-x:auto; flex-wrap:nowrap; justify-content:flex-start; -webkit-overflow-scrolling:touch; scroll-padding:0.6rem; }
    .toolbar-label{ display:none; }
    .tool-btn{ font-size:0.66rem; min-height:var(--tap-min); padding:0.4rem 0.65rem; flex-shrink:0; }
    .reset-link{ min-height:var(--tap-min); }
    .hud-credits{ display:none; }
  }

  /* leaflet overrides */
  .leaflet-draw.leaflet-control{ display:none !important; }
  .leaflet-control-zoom{ margin-top:6.5rem !important; border-radius:var(--r-sm) !important; overflow:hidden; box-shadow:var(--shadow-1) !important; }
  .leaflet-popup-content-wrapper{ background:var(--bg-2); color:var(--ink); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--shadow-2); }
  .leaflet-popup-tip{ background:var(--bg-2); border:1px solid var(--line); }
  .leaflet-popup-content{ margin:0.9rem 0.9rem; width:220px !important; }
  .leaflet-popup-content input, .leaflet-popup-content textarea{
    width:100%; background:var(--bg-1); border:1px solid var(--line); border-radius:var(--r-xs); color:var(--ink);
    font-family:'Space Mono',monospace; font-size:0.76rem; padding:0.4rem;
    margin-bottom:0.4rem; box-sizing:border-box; resize:vertical;
  }
  .popup-kicker{ font-size:0.62rem; text-transform:uppercase; letter-spacing:0.14em; color:var(--ink-dim); margin-bottom:0.4rem; }
  .popup-actions{ display:flex; gap:0.4rem; margin-top:0.2rem; }
  .popup-actions button{
    flex:1; background:var(--bg-1); border:1px solid var(--line); border-radius:var(--r-xs); color:var(--ink);
    font-family:'Space Mono',monospace; font-size:0.66rem; padding:0.5rem 0.42rem; min-height:var(--tap-min);
    cursor:pointer; text-transform:uppercase; letter-spacing:0.04em;
    transition:border-color 0.15s var(--ease-soft);
  }
  .popup-actions button.save{ border-color:var(--frost); color:var(--frost); }
  .popup-actions button.del{ border-color:var(--hazard); color:var(--hazard); }
  .popup-actions button.lock{ border-color:var(--ice-300); color:var(--ice-300); }

  .token-popup-row{ display:flex; gap:0.6rem; align-items:flex-start; margin:0.5rem 0; }
  .token-preview-wrap{ flex-shrink:0; }
  .token-preview{
    width:64px; height:64px; border-radius:var(--r-sm); border:2px solid var(--frost);
    background:var(--bg-2); display:flex; align-items:center; justify-content:center;
    overflow:hidden; font-family:'Oswald',sans-serif; font-weight:700; font-size:16px; color:var(--ink);
  }
  .token-preview img{ width:100%; height:100%; object-fit:cover; display:block; }
  .token-popup-fields{ flex:1; display:flex; flex-direction:column; gap:0.25rem; min-width:0; }
  .token-field-label{ font-size:0.6rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-dim); margin-top:0.2rem; }
  .token-popup-fields input[type=color]{
    width:100%; height:1.8rem; padding:0.1rem; background:var(--bg-2); border:1px solid var(--line); cursor:pointer;
  }
  .token-popup-fields input[type=file]{
    width:100%; font-size:0.65rem; color:var(--ink-dim); font-family:'Space Mono',monospace;
  }
  .token-image-clear{
    align-self:flex-start; background:none; border:1px solid var(--line); border-radius:var(--r-xs); color:var(--ink-dim);
    font-family:'Space Mono',monospace; font-size:0.62rem; padding:0.25rem 0.5rem; cursor:pointer; margin-top:0.15rem;
  }
  .token-image-clear:hover{ border-color:var(--hazard); color:var(--hazard); }
  .leaflet-container a.leaflet-popup-close-button{ color:var(--ink-dim); }
  .shape-label{
    background:var(--bg-2) !important; border:1px solid var(--hazard) !important; color:var(--ink) !important;
    font-family:'Space Mono',monospace; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.06em;
    box-shadow:var(--shadow-1) !important; border-radius:var(--r-xs) !important; padding:0.22rem 0.55rem !important;
  }
  .shape-label::before{ display:none !important; }
  .route-label{ border-color:var(--frost) !important; }

  @keyframes pinDrop{
    0%{ transform:scale(0) translateY(-14px); opacity:0; }
    60%{ transform:scale(1.15) translateY(0); opacity:1; }
    100%{ transform:scale(1) translateY(0); }
  }
  @keyframes radarPing{
    0%{ transform:scale(0.7); opacity:0.7; }
    100%{ transform:scale(1.9); opacity:0; }
  }
  .pin-wrap{
    position:relative; width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
  }
  /* NPCs usam um badge maior para ficarem visualmente equivalentes aos tokens
     de jogador (mesma "área" no mapa), mesmo sendo um círculo em vez de um quadrado */
  .pin-wrap-npc{ width:44px; height:44px; }
  .pin-wrap-npc .pin-badge{ width:44px; height:44px; }
  .pin-wrap-npc .pin-badge svg{ width:22px; height:22px; }
  /* Veículo e abrigo recebem o mesmo tratamento — ficam do tamanho dos
     NPCs/tokens, já que também podem "conter" jogadores e NPCs dentro deles */
  .pin-wrap-abrigo, .pin-wrap-veiculo{ width:44px; height:44px; }
  .pin-wrap-abrigo .pin-badge, .pin-wrap-veiculo .pin-badge{ width:44px; height:44px; }
  .pin-wrap-abrigo .pin-badge svg, .pin-wrap-veiculo .pin-badge svg{ width:22px; height:22px; }
  .pin-badge{
    position:relative; z-index:2;
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--bg-0);
    box-shadow:0 3px 8px rgba(0,0,0,0.55);
    animation:pinDrop 0.4s cubic-bezier(.34,1.56,.64,1);
    transition:transform 0.15s ease;
  }
  .pin-wrap:hover .pin-badge{ transform:scale(1.18) translateY(-2px); }
  .pin-badge svg{ width:16px; height:16px; stroke:var(--bg-0); }
  .pin-badge-photo{ overflow:hidden; }
  .pin-badge-photo img{ width:100%; height:100%; object-fit:cover; display:block; border-radius:50%; }
  .pin-wrap.locked .pin-badge::after{
    content:"🔒"; position:absolute; bottom:-5px; right:-5px; font-size:9px; line-height:1;
    background:var(--bg-0); border:1px solid var(--ice-300); border-radius:50%;
    width:14px; height:14px; display:flex; align-items:center; justify-content:center;
  }
  .pin-ping{
    position:absolute; z-index:1; inset:0; border-radius:50%;
    border:2px solid var(--hazard);
    animation:radarPing 1.8s infinite ease-out;
  }
  /* etiqueta de nome do NPC, abaixo do badge — mesmo visual/regra da etiqueta
     de nome dos tokens (token-name-tag), só que posicionada em absolute pq
     o pin-wrap não usa layout em coluna como o token-wrap */
  .pin-name-tag{
    position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:2px;
    max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-family:'Space Mono',monospace; font-size:0.58rem; font-weight:700; color:#fff;
    background:rgba(10,14,18,0.72); border:1px solid rgba(255,255,255,0.15);
